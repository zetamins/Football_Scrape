sonar.projectKey=football-backend
sonar.sources=football,android/app/src/main
sonar.tests=tests,android/app/src/test,android/app/src/androidTest
sonar.exclusions=**/build/**,**/.venv/**,**/node_modules/**,**/.gradle/**,**/*.pyc,**/__pycache__/**,**/*.ttf
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.jacoco.xmlReportPaths=android/app/build/reports/kover/reportDebug.xml

# python:S5778 ("only one method invocation expected when testing runtime
# exceptions") false-positives systematically on the
# `with pytest.raises(...): asyncio.run(some_async_call(...))` idiom used
# throughout this test suite for testing async functions from sync test
# functions -- the analyzer counts asyncio.run(x()) as two invocations
# syntactically, but only the inner coroutine can actually raise; the
# asyncio.run() wrapper is a required sync/async bridge, not a second
# meaningful call. Verified against ~10 of the 21 flagged instances
# (test_browser.py, test_cli.py, test_http.py, test_orchestrate.py,
# test_goal.py, test_soccerdesk.py, test_sofascore.py, test_three65scores.py,
# test_fotmob.py) -- all share the identical single-call shape. Excluded
# project-wide for tests/ rather than 21 individual inline comments, since
# this is a systematic idiom that will recur for any future async test
# written the same way, not a one-off.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S5778
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**/*.py
