name: CI and Release

# Two independent jobs on purpose: the Python test suite is fast and runs
# on every push/PR for quick feedback; the Android build is slow (Chaquopy
# downloads a full Python distribution, Gradle has no warm cache on a
# fresh runner) and only has a reason to run when we're actually cutting
# a release, so it's gated on version tags rather than every push.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      # --extra browser + a real Chromium install: one test
      # (test_browser.py's end-to-end launch test) deliberately runs an
      # unmocked Playwright browser launch to verify the real success
      # path, not just the ImportError fallback -- confirmed by
      # reproducing the exact `uv sync --group dev` (no extra) CI failure
      # locally before this fix.
      - name: Install dependencies (from uv.lock)
        run: uv sync --group dev --extra browser

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        run: uv run pytest tests/ -q

  build-and-release:
    name: Build APK and publish GitHub Release
    needs: test
    # Only on a version tag push (v1.0.0, v1.2.3-beta, ...) -- never on a
    # plain push to main, so merging to main can't accidentally cut a
    # public release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create a GitHub Release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # GitHub's ubuntu-latest runners ship with the Android SDK
      # pre-installed (ANDROID_HOME set, licenses pre-accepted) --
      # android-actions/setup-android@v3 was tried here first and failed
      # (forced onto Node 24 despite targeting Node 20, per the runner's
      # own deprecation warning) with no further detail visible without
      # repo-admin log access. Removed rather than debugged further:
      # AGP auto-downloads any additional SDK platform/build-tools it
      # needs during the build itself, so no separate setup step is
      # actually required.

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Debug-signed build: no release keystore is available to this
      # workflow (keystore.properties is gitignored on purpose -- see
      # android/.gitignore -- and the real .jks lives outside the repo
      # entirely). This produces an installable, debuggable APK, not a
      # Play-Store-ready release build. To build a properly signed
      # release APK instead, add the keystore (base64-encoded) and its
      # passwords as repo secrets, decode the keystore to
      # android/app/release.jks and write android/keystore.properties
      # from secrets in a step here, then run `assembleRelease` below
      # instead of `assembleDebug`.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --console=plain

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          name: ${{ github.ref_name }}
