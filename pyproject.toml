[project]
name = "football-backend"
version = "0.1.0"
description = "Football match/team data scraper and analysis backend (Python port)"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "playwright>=1.45",
]

[project.scripts]
football-search = "football.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["football"]
