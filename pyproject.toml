[project]
name = "football-backend"
version = "0.1.0"
description = "Football match/team data scraper and analysis backend (Python port)"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
]

# Playwright drives the 3 real-browser sources (Sofascore, Squawka,
# worldfootball) and needs a full Chromium binary + Node-based driver
# subprocess -- unavailable under Chaquopy (Python-on-Android), not just
# unpackaged for it. It's an optional extra rather than a base dependency
# so the other 10 (plain-HTTP) sources, and everything built on top of
# them, install and run without it. See football/browser.py.
[project.optional-dependencies]
browser = ["playwright>=1.45"]

[project.scripts]
football-search = "football.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
# Without this, pytest's default discovery walks into android/ and finds
# the SAME files again through the app/src/main/python/football symlink
# (one source of truth for the Android build, not a copy -- see that
# symlink's own commit) -- every test collected and run twice.
testpaths = ["tests"]

[tool.coverage.run]
# Store file paths in coverage.xml relative to the repo root rather than
# as absolute host paths -- without this, a coverage.xml generated on
# the host is unusable by any tool reading it from a different mount
# point (e.g. a Docker-based SonarQube scanner mounting this repo at
# /usr/src instead of its real host path), silently dropping coverage
# for every file it can't resolve.
relative_files = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["football"]
